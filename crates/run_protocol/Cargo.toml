[package]
name = "run_protocol"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Data model and invariants for the Run Protocol"
repository = "https://github.com/wangyuxinwhy/runlab"
homepage = "https://wangyuxinwhy.github.io/runlab/"
documentation = "https://docs.rs/run_protocol"
license = "MIT"
readme = "README.md"
keywords = ["agent", "oci", "protocol", "execution"]
categories = ["development-tools"]
include = ["/Cargo.toml", "/LICENSE", "/README.md", "/src/**"]
publish = ["crates-io"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
oci-spec = { version = "0.10.0", default-features = false, features = ["image", "runtime"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
