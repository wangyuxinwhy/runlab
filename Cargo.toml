[workspace]
members = [".", "crates/run_engine", "crates/run_protocol"]
resolver = "3"

[package]
name = "runlab"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Execute OCI Images and preserve immutable Agent Run Records"
repository = "https://github.com/wangyuxinwhy/runlab"
homepage = "https://wangyuxinwhy.github.io/runlab/"
documentation = "https://wangyuxinwhy.github.io/runlab/"
license = "MIT"
readme = "README.md"
keywords = ["agent", "oci", "experiment", "sandbox", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/THIRD_PARTY_NOTICES.md",
    "/docs/**",
    "/src/**",
    "/tests/**",
]

[[bin]]
name = "runlab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
jsonschema = { version = "0.52.0", default-features = false }
oci-spec = { version = "0.10.0", default-features = false, features = ["image"] }
run_engine = { version = "0.1.0", path = "crates/run_engine" }
run_protocol = { version = "0.1.0", path = "crates/run_protocol" }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4.4"
tar = "0.4.46"
tempfile = "3.27.0"
uuid = { version = "1.24.1", features = ["serde", "v4"] }
zstd = "0.13.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
