[workspace]
members = [".", "crates/run_engine", "crates/run_protocol"]
resolver = "3"

[package]
name = "runlab"
version = "0.2.0-dev.0"
edition = "2024"
rust-version = "1.95"
description = "Execute OCI Images and preserve immutable Agent Run Records"
repository = "https://github.com/wangyuxinwhy/runlab"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/src/**",
    "/tests/**",
]

[[bin]]
name = "runlab"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
oci-spec = { version = "0.10.0", default-features = false, features = ["runtime"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "rustls"] }
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "mount", "process", "time"] }
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = "0.4.4"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.18"
uuid = { version = "1.24.1", features = ["serde", "v7"] }
zstd = "0.13.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
